<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dress Decode — Fashion</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

  <!-- TOP BAR -->
  <header class="topbar">
    <button class="icon">‹</button>
    <strong>dress.decode_</strong>
    <button class="icon">⋮</button>
  </header>

  <!-- PROFILE -->
  <section class="profile">

    <div class="profile-row">

      <img
        class="avatar"
        src="profile.jpg"
        alt="Dress Decode profile"
      >

      <div class="stats">
        <div>
          <b>3,822</b>
          <span>posts</span>
        </div>

        <div>
          <b>166K</b>
          <span>followers</span>
        </div>

        <div>
          <b>182</b>
          <span>following</span>
        </div>
      </div>

    </div>

    <h1>Dress Decode</h1>

    <p class="bio">
      All the decoding of glamour ✨<br>
      DM to get featured<br>
      <a href="#">@dress.decode2.0</a>
    </p>

    <div class="followed">
      Followed by <b>arhsubanas</b> and <b>lubanastore</b>
    </div>

    <div class="actions">
      <button class="primary">Follow</button>
      <button class="secondary">Message</button>
    </div>

    <!-- HIGHLIGHTS -->
    <div class="highlights">

      <div class="highlight">
        <span class="story">✨</span>
        <small>sonya hussyn</small>
      </div>

      <div class="highlight">
        <span class="story">CM</span>
        <small>CM</small>
      </div>

      <div class="highlight">
        <span class="story">👗</span>
        <small>Khushbakht</small>
      </div>

      <div class="highlight">
        <span class="story">💛</span>
        <small>repost</small>
      </div>

    </div>

  </section>

  <!-- TABS -->
  <nav class="tabs">
    <button class="active">▦</button>
    <button>▷</button>
    <button>↻</button>
    <button>◎</button>
  </nav>

  <!-- POSTS -->
  <main class="posts">

    <div class="post">
      <img src="fashion-grid.jpg" alt="Fashion collection">
    </div>

    <div class="post">
      <img src="fashion-grid.jpg" alt="Fashion collection">
    </div>

    <div class="post">
      <img src="fashion-grid.jpg" alt="Fashion collection">
    </div>

    <div class="post">
      <img src="fashion-grid.jpg" alt="Fashion collection">
    </div>

    <div class="post">
      <img src="fashion-grid.jpg" alt="Fashion collection">
    </div>

    <div class="post">
      <img src="fashion-grid.jpg" alt="Fashion collection">
    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    <a href="#home">Home</a>
    <a href="#collection">Collection</a>
    <a href="#contact">Contact</a>
  </footer>
